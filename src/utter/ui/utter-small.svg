<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="16" height="16">
  <!-- Utter at 16-24px (the tray, menus, small launchers): the tile, U, megaphone and waves of
       utter.svg with the letters, cap and shading dropped and every stroke thickened, because at
       this size they would only blur into the tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15196a"/>
      <stop offset="0.6" stop-color="#22409d"/>
      <stop offset="1" stop-color="#3a3fa0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#tile)"/>
  <path d="M14 38 Q40 36 56 24 V68 Q40 58 14 56 Z" fill="#eef0f5"/>
  <path d="M35 58 V84 A19 19 0 0 0 73 84 V68" fill="none" stroke="#eef0f5" stroke-width="18"/>
  <g fill="none" stroke="#eef0f5" stroke-linecap="round" stroke-width="10">
    <path d="M78 28 Q94 46 78 66"/>
    <path d="M96 14 Q120 46 96 80"/>
  </g>
</svg>
